<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="2; url=$(link-orig)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Advertisement</title>
  <link rel="stylesheet" href="css/theme.css">
  <script>
    var popup='';
    function openOrig(){
      if(window.focus) popup.focus();
      location.href=unescape('$(link-orig-esc)');
    }
    function openAd(){
      location.href=unescape('$(link-redirect-esc)');
    }
    function openAdvert(){
      if(window.name!='hotspot_advert'){
        popup=open('$(link-redirect)','hotspot_advert','');
        setTimeout("openOrig()",1000);
        return;
      }
      setTimeout("openAd()",1000);
    }
  </script>
</head>
<body class="page mood-warn" onLoad="openAdvert()">
  <div class="ticket" style="text-align:center">
    <div class="stamp" style="margin:0 auto 14px">PUB</div>
    <div class="h1">Publicité</div>
    <p class="sub">Si rien ne se passe automatiquement, ouvrez
      <a href="$(link-redirect)" target="hotspot_advert">la publicité</a> manuellement.
    </p>
  </div>
</body>
</html>
