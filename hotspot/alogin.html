<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Redirect</title>
  <link rel="stylesheet" href="css/theme.css">
  <script>
    function startClock(){
      $(if popup == 'true')
        open('$(link-status)','hotspot_status','toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=320,height=220');
      $(endif)
      location.href=unescape('$(link-redirect-esc)');
    }
  </script>
</head>
<body class="page mood-ok" onLoad="startClock()">
  <div class="ticket" style="text-align:center">
    <div class="stamp" style="margin:0 auto 14px">OK</div>
    <div class="h1">Connexion réussie</div>
    <p class="sub">Si la page ne s'ouvre pas automatiquement, cliquez
      <a href="$(link-redirect)">ici</a>.
    </p>
  </div>
</body>
</html>
