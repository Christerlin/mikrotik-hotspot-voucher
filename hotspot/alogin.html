<!doctype html>
<html lang="ht">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="2; url=$(link-redirect)">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <title>Redirect</title>
  <style>
    :root{
      --accent:#2563eb;--accent-hover:#1d4ed8;--bg:#efe7d6;--card:#faf4e6;--text:#3a3428;--muted:#8a8064;--border:#e4d9bf
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;align-items:center;justify-content:center}
    .card{width:420px;max-width:92%;padding:32px;border-radius:14px;border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,0.06);background:var(--card);text-align:center;animation:fadeIn .5s ease}
    h1{font-size:22px;margin:0 0 14px}
    p{margin:0;color:var(--muted);font-size:15px}
    a{color:var(--accent);font-weight:600;text-decoration:none;margin-left:6px}
    a:hover{color:var(--accent-hover)}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  </style>
  <script>
    function startClock(){
      $(if popup == 'true')
        open('$(link-status)','hotspot_status','toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=320,height=220');
      $(endif)
      location.href=unescape('$(link-redirect-esc)');
    }
  </script>
</head>
<body onLoad="startClock()">
  <div class="card">
    <h1>✅ Connexion réussie</h1>
    <p>Si la page ne s'ouvre pas automatiquement, cliquez 
      <a href="$(link-redirect)">ici</a>.
    </p>
  </div>
</body>
</html>
