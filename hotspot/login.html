<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Connexion Voucher</title>
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0;" />
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{
      --accent:#2563eb;
      --accent-hover:#1d4ed8;
      --bg:#efe7d6;
      --card:#faf4e6;
      --text:#3a3428;
      --muted:#8a8064;
      --border:#e4d9bf;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;height:100%;
      font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      background:var(--bg);color:var(--text);
      display:flex;justify-content:center;align-items:center;
    }
    .card{
      background:var(--card);
      padding:32px 26px;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 4px 16px rgba(0,0,0,0.06);
      width:360px;max-width:92%;
      text-align:center;
    }
    h2{font-size:20px;font-weight:600;margin:0 0 6px}
    p.sub{font-size:14px;color:var(--muted);margin:0 0 22px}
    .voucher-input input{
      width:100%;padding:13px;font-size:17px;text-align:center;letter-spacing:2px;
      border:1px solid var(--border);border-radius:10px;outline:none;
      background:#fffdf7;color:var(--text);transition:border-color .2s,box-shadow .2s;
    }
    .voucher-input input:focus{
      border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.15);
    }
    .btn{
      width:100%;padding:13px;margin-top:16px;
      background:var(--accent);border:none;border-radius:10px;
      color:#fff;font-size:16px;font-weight:600;cursor:pointer;
      transition:background .2s;
    }
    .btn:hover{background:#1d4ed8}
    .btn:disabled{opacity:.65;cursor:default}
    .footer{margin-top:20px;font-size:13px;color:var(--muted);line-height:1.6}
    .footer p{margin:6px 0}
    .error{color:#dc2626;font-size:14px;margin-top:12px}
    a{color:var(--accent);text-decoration:none;font-weight:600}
    a:hover{text-decoration:underline}
    .credit{margin-top:18px;font-size:11px;color:#9ca3af}
  </style>
</head>
<body>

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
  <input type="hidden" name="username" />
  <input type="hidden" name="password" />
  <input type="hidden" name="dst" value="status.html" />
  <input type="hidden" name="popup" value="true" />
</form>

<script type="text/javascript" src="/md5.js"></script>
<script type="text/javascript">
function doLogin() {
  var voucher = document.login.username.value;
  document.sendin.username.value = voucher;
  document.sendin.password.value = hexMD5('$(chap-id)' + voucher + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="card">
  <h2>Connexion Wi-Fi</h2>
  <p class="sub">Entrez votre code d'accès pour vous connecter.</p>

  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="status.html" />
    <input type="hidden" name="popup" value="true" />

    <div class="voucher-input">
      <input type="text" id="voucher" maxlength="8" name="username" value="$(username)"
             placeholder="Votre code" required
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>

    <button class="btn" type="submit" id="submitBtn">Se connecter</button>

    $(if error)<div class="error">$(error)</div>$(endif)

    <div class="footer">
      <p>Pas de code ? <a href="prix.html">Achetez par MonCash ou NatCash</a></p>
      <p>Déjà payé ? <a href="prix.html?retrieve=1">Vérifier mon paiement</a></p>
    </div>

    <div class="credit">© Codemi</div>
  </form>
</div>

<script type="text/javascript">
  (function () {
    var input = document.getElementById('voucher');
    var form = document.forms['login'];
    var btn = document.getElementById('submitBtn');
    if (input) {
      input.addEventListener('input', function () {
        this.value = this.value.replace(/\s+/g, '');
      });
    }
    if (form && btn) {
      form.addEventListener('submit', function () {
        btn.disabled = true;
        btn.textContent = 'Connexion...';
      });
    }

    // Auto-connexion : si un code est passé dans l'URL (retour de paiement),
    // on remplit le champ et on soumet automatiquement.
    var params = new URLSearchParams(window.location.search);
    var autoCode = params.get('code');
    if (autoCode && input) {
      input.value = autoCode.replace(/\s+/g, '');
      if (btn) { btn.disabled = true; btn.textContent = 'Connexion...'; }
      if (typeof doLogin === 'function') {
        doLogin();            // CHAP : calcule le MD5 et soumet
      } else if (form) {
        form.submit();        // repli sans CHAP
      }
    } else if (!autoCode) {
      // Récupération : si un paiement récent est en attente (client bloqué sur la
      // page pub puis revenu ici), on retourne au suivi pour récupérer le code.
      try {
        var pend = JSON.parse(localStorage.getItem('pendingOrder') || 'null');
        if (pend && pend.reference && pend.ts && (Date.now() - pend.ts < 20 * 60000)) {
          window.location = 'prix.html';
        }
      } catch (e) { /* ignore */ }
    }
  })();
</script>

</body>
</html>
