<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Connexion Voucher</title>
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0;" />
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="page">

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
  <input type="hidden" name="username" />
  <input type="hidden" name="password" />
  <input type="hidden" name="dst" value="status.html" />
  <input type="hidden" name="popup" value="true" />
</form>

<script type="text/javascript" src="/md5.js"></script>
<script type="text/javascript">
function doLogin() {
  var voucher = document.login.username.value;
  document.sendin.username.value = voucher;
  document.sendin.password.value = hexMD5('$(chap-id)' + voucher + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="ticket" style="text-align:center">
  <div class="h1">LAMBDA WIFI</div>
  <p class="sub">Entrez votre code d'accès pour vous connecter au réseau.</p>

  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="status.html" />
    <input type="hidden" name="popup" value="true" />

    <div class="voucher-input">
      <input type="text" id="voucher" maxlength="8" name="username" value="$(username)"
             placeholder="CODE" required
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>

    <button class="buy" type="submit" id="submitBtn">Se connecter</button>

    $(if error)<div class="err">$(error)</div>$(endif)

    <div class="perforation"></div>

    <div class="stub" style="text-align:center;font-size:13px;color:var(--ink-soft);line-height:1.5">
      <div style="margin-bottom:10px">
        <div>Pas de code ?</div>
        <a href="prix.html">Achetez par Moncash ou Natcash</a>
      </div>
      <div>
        <div>Déjà payé ?</div>
        <a href="prix.html?retrieve=1">Vérifier mon paiement</a>
      </div>
    </div>
  </form>

  <footer class="credit">© Codemi</footer>
</div>

<script type="text/javascript">
  (function () {
    var input = document.getElementById('voucher');
    var form = document.forms['login'];
    var btn = document.getElementById('submitBtn');
    if (input) {
      input.addEventListener('input', function () {
        this.value = this.value.replace(/\s+/g, '');
      });
    }
    if (form && btn) {
      form.addEventListener('submit', function () {
        btn.disabled = true;
        btn.textContent = 'Connexion...';
      });
    }

    // Auto-connexion : si un code est passé dans l'URL (retour de paiement),
    // on remplit le champ et on soumet automatiquement.
    var params = new URLSearchParams(window.location.search);
    var autoCode = params.get('code');
    if (autoCode && input) {
      input.value = autoCode.replace(/\s+/g, '');
      if (btn) { btn.disabled = true; btn.textContent = 'Connexion...'; }
      if (typeof doLogin === 'function') {
        doLogin();            // CHAP : calcule le MD5 et soumet
      } else if (form) {
        form.submit();        // repli sans CHAP
      }
    } else if (!autoCode) {
      // Récupération : si un paiement récent est en attente (client bloqué sur la
      // page pub puis revenu ici), on retourne au suivi pour récupérer le code.
      try {
        var pend = JSON.parse(localStorage.getItem('pendingOrder') || 'null');
        if (pend && pend.reference && pend.ts && (Date.now() - pend.ts < 20 * 60000)) {
          window.location = 'prix.html';
        }
      } catch (e) { /* ignore */ }
    }
  })();
</script>

</body>
</html>
